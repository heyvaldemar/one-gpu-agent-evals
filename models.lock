# This repository's own, for line 2 (model size against planted instructions)
# and its gpt-oss series. One family, Qwen3, from 0.6B to 32B; the publisher's
# own files where it has them (it ships only Q8_0 at 0.6B and 1.7B), and
# IQ4_XS from one quantizer for the two points that need it, since 32B in
# Q4_K_M does not fit beside its KV cache in 24 GB. Two bridges keep a change
# of file from reading as a change of size: 4B in Q8_0 and Q4_K_M, 14B in
# Q4_K_M and IQ4_XS. granite-4.0-h-small is a 32B mixture of experts and is
