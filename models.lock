# The models this repository serves, one per line, in the flagship's format:
#
# name  url-at-revision  sha256  license  image-digest
#
# A line the flagship's release also carries is copied from its
# models/models.lock byte for byte, and scripts/validate.sh fails when it
# differs from the release sources.lock pins. scripts/models.sh downloads a
# file only by its line here, refuses one whose sha256 differs, and refuses a
# licence that is not a permissive OSI one. The fifth field is the
# flagship's signed model image for a line the release carries; nothing here
# builds or pulls it, the weights are served from the file the line pins. A
# line of this repository's own says `unpinned` there: its weights are pinned
# by revision and sha256 like every other, and no CI rebuilds an image of them
# (the largest are 20 GB, more than a runner builds). The flagship reads this
# file through its MODELS_LOCK.
#
# From the flagship's release v1.9.0:
